# Запуск (CPU):  docker compose up --build
# Скачать веса один раз:  docker compose run --rm imagehub models --download
services:
  imagehub:
    build:
      context: .
    image: imagehub:cpu
    ports: ["8765:8765"]
    volumes:
      - ${IMAGEHUB_DATA:-./data}:/data
      - ${IMAGEHUB_WEIGHTS:-./weights}:/weights
      - ${IMAGEHUB_PHOTOS:-./photos}:/photos:ro   # папки с изображениями для импорта: путь внутри контейнера /photos
